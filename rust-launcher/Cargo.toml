[package]
name = "tokens-ui-launcher"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Hidden supervisor and doctor for Tokens UI For Codex"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
time = { version = "0.3.55", features = ["formatting", "parsing", "macros"] }
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
codegen-units = 1
debug = 1
lto = "thin"
panic = "abort"
strip = false
