name: Windows tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: PowerShell parse check
        shell: pwsh
        run: |
          $errors = $null
          foreach ($file in @('install.ps1', 'install-autostart.ps1', 'uninstall-autostart.ps1')) {
            if (-not (Test-Path -LiteralPath $file)) { throw "PowerShell file missing: $file" }
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { throw "PowerShell parse failed: $file" }
          }
